<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>🌋</title>
    <style>
        body { 
            background-color: black; 
            color: #00FF00; 
            font-family: "Courier New", Courier, monospace; 
            font-size: 16px; 
            padding: 20px; 
            overflow: hidden; 
        }
        #cmd { line-height: 1.5; }
        .error { color: #FF0000; font-weight: bold; }
        p { margin: 5px 0; } /* Για να μην έχουν μεγάλα κενά οι γραμμές */
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="cmd"></div>
<script>
  const lines = [
    "> CONNECTING TO DISCORD_Διαφυλετικό All Stars",
    "> CONNECTION ESTABLISHED AT PORT #3237",
    "> DELETING SYSTEM32 FILES *.DLL",
  ];

  let i = 0;
  function typeWriter() {
    if (i < lines.length) {
      let div = document.getElementById("cmd");
      let newLine = document.createElement("p");
      if (lines[i].includes("ERROR") || lines[i].includes("WARNING")) {
        newLine.className = "error";
      }
      newLine.innerHTML = lines[i];
      div.appendChild(newLine);
      i++;
      setTimeout(typeWriter, 340);
    } else {
      setTimeout(() => {
        window.location.href = "https://nto-panag.github.io/TW/"; 
      }, 800);
    }
  }
  typeWriter();
</script>
</body>
</html>
